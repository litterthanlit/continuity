name: Release

# Publishes @litterthanlit/continuity to npm with provenance and cuts a GitHub release.
#   - push a tag `vX.Y.Z` (matching package.json and plugin.json), or
#   - run it manually ("Run workflow") on a branch: it releases v<package.json version>
#     from that commit and creates the tag itself.
# Needs the repository secret NPM_TOKEN.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      HYPERFRAMES_NO_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag, package.json and plugin.json versions agree
        run: |
          pkg="$(node -p 'require("./package.json").version')"
          plugin="$(node -p 'require("./plugin/.claude-plugin/plugin.json").version')"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="v$pkg"; fi
          echo "tag=$tag package=$pkg plugin=$plugin"
          test "$tag" = "v$pkg" && test "$pkg" = "$plugin"
          if npm view "@litterthanlit/continuity@$pkg" version >/dev/null 2>&1; then echo "::error::$pkg is already on npm — bump the version"; exit 1; fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - run: pnpm verify
      - run: pnpm -s ct licenses
      - run: node scripts/pack-smoke.mjs
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        # Creates the tag at this commit when the run was dispatched from a branch.
        run: gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
